<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - {{ empresa.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">

<div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-lg shadow">
    <h1 class="text-2xl font-bold text-emerald-700 mb-2">{{ titulo }}</h1>
    <p class="mb-6 text-gray-600">Seleccione el formato en el que desea descargar el informe:</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <a href="{{ url_base }}?formato=excel" 
           class="flex items-center justify-center gap-3 px-6 py-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors">
            <i class="fas fa-file-excel text-2xl"></i>
            <span>Descargar Excel</span>
        </a>
        <a href="{{ url_base }}?formato=pdf" 
           class="flex items-center justify-center gap-3 px-6 py-4 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">
            <i class="fas fa-file-pdf text-2xl"></i>
            <span>Descargar PDF</span>
        </a>
    </div>

    <div class="mt-6 text-center">
        <a href="{% url 'panel_empresa' slug=slug %}" class="text-gray-500 hover:text-gray-700 text-sm">
            <i class="fas fa-arrow-left mr-1"></i> Volver al panel
        </a>
    </div>
</div>

</body>
</html>
