<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Socios - {{ empresa.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-lg shadow">
        <h1 class="text-2xl font-bold text-emerald-700 mb-4">Informe Socios</h1>
        <p class="mb-6 text-gray-600">Seleccione el criterio de ordenamiento y el formato de salida.</p>

        <form id="informeSociosForm" method="get" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Ordenar por:</label>
                <select name="order_by" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="apellido_paterno">Apellido Paterno</option>
                    <option value="fecha_incorporacion">Fecha de Incorporación</option>
                    <option value="sector">Sector</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Dirección:</label>
                <select name="direction" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="asc">Ascendente</option>
                    <option value="desc">Descendente</option>
                </select>
            </div>
            <div class="flex flex-col sm:flex-row justify-between gap-3 pt-4 border-t border-gray-200">
                <a href="{% url 'panel_empresa' slug=slug %}" class="px-4 py-2 text-center text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>Volver al Panel
                </a>
                <div class="flex gap-2">
                    <button type="submit" onclick="setFormato('excel')" class="px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors flex items-center gap-2">
                        <i class="fas fa-file-excel"></i> Excel
                    </button>
                    <button type="submit" onclick="setFormato('pdf')" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors flex items-center gap-2">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('informeSociosForm');
        const urlExcel = "{% url 'exportar_socios_excel' alias=slug %}";
        const urlPdf = "{% url 'exportar_socios_pdf' alias=slug %}";

        function setFormato(formato) {
            form.action = (formato === 'pdf') ? urlPdf : urlExcel;
        }
    </script>
</body>
</html>
