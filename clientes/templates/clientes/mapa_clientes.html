<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Clientes - {{ empresa.nombre }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 600px; width: 100%; }
    .leaflet-popup-content { width: 250px; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <header class="bg-emerald-700 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">📍 Mapa de Clientes - {{ empresa.nombre }}</h1>
      <a href="{% url 'listado_clientes' alias=slug %}" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm transition-colors">
        ← Volver al listado
      </a>
    </div>
  </header>

  <div class="max-w-7xl mx-auto py-6 px-4">
    <!-- Estadística -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
      <p class="text-sm text-gray-600">Total de clientes con ubicación: <span class="font-bold">{{ total_clientes }}</span></p>
    </div>

    <!-- Mapa -->
    <div id="map" class="rounded-lg shadow-md border border-gray-300"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const puntos = {{ puntos|safe }};

      if (!puntos || puntos.length === 0) {
        // Si no hay puntos, mostrar mapa con vista por defecto y mensaje
        const map = L.map('map').setView([-33.7, -70.7], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        L.popup()
          .setLatLng([-33.7, -70.7])
          .setContent("No hay clientes con coordenadas registradas.")
          .openOn(map);
        return;
      }

      // Inicializar mapa
      const map = L.map('map').setView([-33.7, -70.7], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      const markers = [];

      puntos.forEach(p => {
        const marker = L.marker([p.lat, p.lng]).addTo(map);
        
        // Contenido del popup con enlace al detalle
        const popupContent = `
          <div style="font-family: Arial, sans-serif;">
            <strong style="font-size: 1.1em;">${p.nombre}</strong><br>
            <span>RUT: ${p.rut}</span><br>
            <span>Medidor: ${p.medidor || '—'}</span><br>
            <span>Dirección: ${p.direccion || '—'}</span><br>
            <hr class="my-2">
            <a href="/empresa/{{ slug }}/clientes/${p.id}/" 
               style="display: inline-block; background-color: #059669; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9rem;">
              Ver detalle
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);

        markers.push(marker);
      });

      // Ajustar zoom para ver todos los marcadores
      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
      }
    });
  </script>
</body>
</html>
