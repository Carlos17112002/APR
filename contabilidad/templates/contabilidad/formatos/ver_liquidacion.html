{% extends 'contabilidad/formatos/formato_profesional.html' %}

{% block extra_scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    (function() {
        // Esperar a que la página esté completamente cargada
        window.onload = function() {
            // Pequeño retraso para asegurar que todo esté renderizado
            setTimeout(function() {
                const elemento = document.body; // o un contenedor específico
                html2canvas(elemento, {
                    scale: 2,
                    logging: false,
                    allowTaint: true,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                }).then(canvas => {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4',
                        compress: true
                    });
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    const imgWidth = 210;
                    const pageHeight = 297;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    let heightLeft = imgHeight;
                    let position = 0;
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, '', 'FAST');
                    heightLeft -= pageHeight;
                    while (heightLeft > 0) {
                        position -= pageHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, '', 'FAST');
                        heightLeft -= pageHeight;
                    }
                    // Descargar el PDF
                    pdf.save(`Liquidacion_{{ trabajador_rut }}_{{ periodo_mes }}_{{ periodo_anio }}.pdf`);
                    
                    // Opcional: cerrar la ventana después de un tiempo
                    setTimeout(() => window.close(), 2000);
                }).catch(error => {
                    console.error('Error generando PDF:', error);
                    alert('Error al generar el PDF. Por favor, intente nuevamente.');
                });
            }, 500);
        };
    })();
</script>
{% endblock %}
