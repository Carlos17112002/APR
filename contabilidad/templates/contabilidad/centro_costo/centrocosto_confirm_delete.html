<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Centro de Costo · {{ empresa.nombre }}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f3f4f6;
        }
        .gradient-navbar {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
        }
    </style>
</head>
<body class="antialiased">
    <!-- Navbar -->
    <nav class="gradient-navbar text-white sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a href="{% url 'centro_costo_list' alias=alias %}" 
                       class="flex items-center space-x-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition-all duration-200 group">
                        <i class="fas fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
                        <span class="text-sm font-medium">Volver al listado</span>
                    </a>
                    <div class="h-6 w-px bg-white/30"></div>
                    <div class="flex items-center space-x-3">
                        <div class="bg-white/20 p-2 rounded-lg">
                            <i class="fas fa-chart-pie"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-lg">{{ empresa.nombre|truncatechars:20 }}</h1>
                            <p class="text-xs opacity-90">Eliminar Centro de Costo</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-md rounded-lg p-8 text-center">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-4">
                <i class="fas fa-exclamation-triangle text-red-600 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">¿Eliminar Centro de Costo?</h1>
            <p class="text-gray-700 mb-6">
                Estás a punto de eliminar el centro de costo <strong>{{ object.codigo }} - {{ object.nombre }}</strong>.<br>
                Esta acción no se puede deshacer.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="flex items-center justify-center space-x-4">
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-red-400 flex items-center">
                        <i class="fas fa-trash-alt mr-2"></i>Sí, eliminar
                    </button>
                    <a href="{% url 'centro_costo_list' alias=alias %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-gray-400">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
