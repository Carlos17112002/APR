<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas por Periodo - {{ empresa.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-lg shadow">
    <h1 class="text-2xl font-bold text-emerald-700 mb-6">Informe de Lecturas por Periodo</h1>
    <p class="text-sm text-gray-500 mb-6">Seleccione el rango de fechas y opcionalmente filtre por socio o contrato</p>

    <form id="reporteForm" method="post" class="space-y-5">
        {% csrf_token %}

        <!-- Rango de fechas -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="far fa-calendar-alt mr-1 text-emerald-600"></i>Fecha Inicio *
                </label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="far fa-calendar-alt mr-1 text-emerald-600"></i>Fecha Fin *
                </label>
                <input type="date" name="fecha_fin" id="fecha_fin" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>
        </div>

        <!-- Filtros opcionales -->
        <div class="border-t border-gray-200 pt-5">
            <p class="text-sm font-medium text-gray-700 mb-3">Filtros adicionales (opcionales)</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-1 text-emerald-600"></i>Nombre del Socio
                    </label>
                    <input type="text" name="nombre_socio" id="nombre_socio" placeholder="Ej: Juan Pérez" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-file-contract mr-1 text-emerald-600"></i>Número de Contrato
                    </label>
                    <input type="text" name="numero_contrato" id="numero_contrato" placeholder="Ej: CONT-001" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                </div>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex flex-col sm:flex-row justify-between gap-3 pt-4 border-t border-gray-200">
            <a href="{% url 'panel_empresa' slug=slug %}" 
               class="px-5 py-2.5 text-center text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Volver al Panel
            </a>
            <div class="flex gap-2">
                <button type="submit" name="excel" value="1"
                        class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition-colors flex items-center gap-2">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
                <button type="button" id="btnPdf"
                        class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>
    </form>

    <!-- Nota informativa -->
    <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
        <div class="flex items-start gap-3">
            <i class="fas fa-info-circle text-blue-500 mt-0.5"></i>
            <div class="text-sm text-blue-700">
                <p class="font-medium mb-1">Información</p>
                <p>Los campos marcados con * son obligatorios. Los filtros adicionales son opcionales.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const btnPdf = document.getElementById('btnPdf');
    const form = document.getElementById('reporteForm');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    btnPdf.addEventListener('click', async function() {
        // Validar fechas
        const fechaInicio = document.getElementById('fecha_inicio').value;
        const fechaFin = document.getElementById('fecha_fin').value;
        if (!fechaInicio || !fechaFin) {
            alert('Debe seleccionar fecha inicio y fecha fin.');
            return;
        }

        btnPdf.disabled = true;
        btnPdf.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Generando...';

        const formData = new FormData(form);
        formData.append('ajax', '1');

        try {
            const response = await fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': csrfToken
                },
                body: formData
            });
            const data = await response.json();

            if (!data.success) {
                alert('Error al obtener datos');
                return;
            }

            const lecturas = data.lecturas;
            if (lecturas.length === 0) {
                alert('No hay lecturas que coincidan con los filtros.');
                return;
            }

            // Crear PDF con jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Título
            doc.setFontSize(16);
            doc.text('LECTURAS POR PERIODO', 14, 20);
            doc.setFontSize(10);
            doc.text(`Rango: ${fechaInicio.split('-').reverse().join('/')} al ${fechaFin.split('-').reverse().join('/')}`, 14, 28);
            
            // Tabla
            const headers = [['Fecha', 'Cliente', 'RUT', 'N° Contrato', 'Lectura (m³)', 'Consumo (m³)', 'Estado']];
            const rows = lecturas.map(l => [
                l.fecha,
                l.cliente,
                l.rut,
                l.contrato,
                l.lectura_actual.toFixed(2),
                l.consumo.toFixed(2),
                l.estado
            ]);

            doc.autoTable({
                head: headers,
                body: rows,
                startY: 35,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [46, 117, 182] },
                alternateRowStyles: { fillColor: [242, 242, 242] }
            });

            doc.save(`lecturas_periodo_${fechaInicio}_${fechaFin}.pdf`);

        } catch (error) {
            console.error(error);
            alert('Error al generar el PDF');
        } finally {
            btnPdf.disabled = false;
            btnPdf.innerHTML = '<i class="fas fa-file-pdf"></i> PDF';
        }
    });
</script>
</body>
</html>
